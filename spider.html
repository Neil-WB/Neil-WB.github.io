<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArXiv Research Tracker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { margin-bottom: 30px; }
        .controls { margin-bottom: 20px; }
        .author { 
            margin-top: 25px;
            font-weight: bold;
            font-size: 1.2em;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        .paper {
            margin: 10px 0 15px 15px;
        }
        .date {
            color: #666;
            font-size: 0.9em;
        }
        #status {
            margin: 10px 0;
            padding: 8px;
            background: #f5f5f5;
        }
        button {
            padding: 8px 16px;
            background: #0366d6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0246a2;
        }
        a { color: #0366d6; }
    </style>
</head>
<body>
    <h1>ArXiv Research Tracker</h1>
    
    <div class="controls">
        <label for="startDate">Papers published since: </label>
        <input type="date" id="startDate" value="2024-11-01">
        <button onclick="fetchAllAuthors()">Search Papers</button>
    </div>
    
    <div id="status">Ready to search. Click the button above to begin.</div>
    <div id="results"></div>

    <script>
        const API_URL = 'https://neil-wbgithubio-production.up.railway.app';
        
        async function fetchAllAuthors() {
            const startDate = document.getElementById('startDate').value;
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            
            status.textContent = 'Fetching authors...';
            results.innerHTML = '';
            
            try {
                const response = await fetch(`${API_URL}/api/authors`);
                if (!response.ok) throw new Error('Failed to fetch authors');
                
                const authors = await response.json();
                status.textContent = `Processing ${authors.length} authors...`;
                
                let totalPapers = 0;
                let authorsWithPapers = 0;
                
                for (let i = 0; i < authors.length; i++) {
                    const author = authors[i];
                    status.textContent = `Searching for ${author.replace('+', ' ')} (${i+1}/${authors.length})...`;
                    
                    const paperData = await fetchAuthorPapers(author, startDate);
                    const papers = paperData.papers || [];
                    
                    if (papers.length > 0) {
                        authorsWithPapers++;
                        totalPapers += papers.length;
                        
                        const authorDiv = document.createElement('div');
                        authorDiv.className = 'author';
                        authorDiv.textContent = author.replace(/\+/g, ' ');
                        results.appendChild(authorDiv);
                        
                        papers.forEach(paper => {
                            const paperDiv = document.createElement('div');
                            paperDiv.className = 'paper';
                            
                            const date = new Date(paper.published);
                            const formattedDate = date.toLocaleDateString('en-US', {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric'
                            });
                            
                            const paperLink = document.createElement('a');
                            paperLink.href = paper.link;
                            paperLink.target = '_blank';
                            paperLink.textContent = paper.title;
                            
                            const dateSpan = document.createElement('span');
                            dateSpan.className = 'date';
                            dateSpan.textContent = ` (${formattedDate})`;
                            
                            paperDiv.appendChild(paperLink);
                            paperDiv.appendChild(dateSpan);
                            results.appendChild(paperDiv);
                        });
                    }
                    
                    // Add a small delay to prevent overwhelming the server
                    await new Promise(r => setTimeout(r, 300));
                }
                
                status.textContent = `Found ${totalPapers} papers from ${authorsWithPapers} authors since ${startDate}`;
                
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                console.error(error);
            }
        }
        
        async function fetchAuthorPapers(author, startDate) {
            const response = await fetch(`${API_URL}/api/arxiv?authorName=${author}&startDate=${startDate}`);
            if (!response.ok) throw new Error(`Failed to fetch papers for ${author}`);
            return await response.json();
        }
    </script>
</body>
</html>
