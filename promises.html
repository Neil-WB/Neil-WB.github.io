<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            width: 100%;
        }
        .container {
            min-height: 100vh;
            width: 100%;
            background: url('alsoimages/joan.jpg') center/cover;
            position: relative;
            background-attachment: fixed;
        }
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.7));
            pointer-events: none;
            position: fixed;
        }
        .gradient-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0.6));
            position: fixed;
        }
        .content {
            position: relative;
            z-index: 10;
            max-width: 48rem;
            margin: 0 auto;
            padding: 2rem;
        }
        .header {
            margin-bottom: 3rem;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 500;
        }
        .text {
            font-size: 1.4rem;
            line-height: 1.6;
        }
        p {
            margin: 1.5rem 0;
        }
        .promise-list {
            margin-top: 2rem;
        }
        .promise-item {
            padding: 1rem 0;
            border-bottom: 1px dotted rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .promise-text {
            flex-grow: 1;
        }
        .promise-source {
            margin-left: 1rem;
            font-size: 0.9rem;
            opacity: 0.6;
        }
        .status {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 1rem;
        }
        .pending {
            background-color: rgba(255, 165, 0, 0.2);
            color: #ffa500;
        }
        .completed {
            background-color: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }
        .manual-promise-section {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
        .add-button {
            display: none; /* Only visible when logged in */
            background: #FF8A3C;
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1rem;
        }
        .add-button:hover {
            background: #FF9F5B;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="vignette"></div>
        <div class="gradient-overlay"></div>
        
        <div class="content">
            <div class="header">
                <h1>Promises</h1>
            </div>
            <div class="text">
                <p>In the olden years, bloggers would keep track of every public prediction they made and compile them on a single page. Ok, maybe that was just Gwern. Anyway I figure I'd better do that for public promises.</p>
                <p>Currently these are:</p>
                
                <div id="promise-list" class="promise-list">
                    <!-- Promises will be loaded here via JavaScript -->
                    <div class="loading">Loading promises...</div>
                </div>
                
                <!-- For manually adding promises that might not be captured by the attribute system -->
                <div class="manual-promise-section">
                    <h2>Manually Tracked Promises</h2>
                    <div id="manual-promises">
                        <!-- This would be populated from a local JSON file or database -->
                    </div>
                    <button id="add-manual-promise" class="add-button">+ Add New Promise (Admin)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // This would normally fetch promises from your site's pages
            // But for now we'll use a static collection to demonstrate

            // In a real implementation, you'd have a server-side script that:
            // 1. Crawls your website for links with data-promise-id attributes
            // 2. Stores them in a database/JSON file
            // 3. This client-side script would then fetch that data

            // Sample dataset of promises found across the site
            const promises = [
                {
                    id: "list-trades",
                    text: "I'll make a list of interesting trades between money and social services",
                    source: "About Me Page",
                    url: "/about",
                    date: "2025-03-17",
                    status: "pending"
                }
                // Additional promises would be populated here
            ];

            // Manually tracked promises (for promises made before the system was implemented)
            const manualPromises = [
                // Historical or manually tracked promises would go here
            ];

            // Render promises in the list
            const promiseListElement = document.getElementById('promise-list');
            promiseListElement.innerHTML = ''; // Clear loading message

            if (promises.length === 0) {
                promiseListElement.innerHTML = '<p>No promises tracked yet.</p>';
            } else {
                promises.forEach(promise => {
                    const promiseElement = document.createElement('div');
                    promiseElement.className = 'promise-item';
                    promiseElement.innerHTML = `
                        <div class="promise-text">${promise.text}</div>
                        <div class="promise-source">From: ${promise.source}</div>
                        <span class="status ${promise.status}">${promise.status}</span>
                    `;
                    promiseListElement.appendChild(promiseElement);
                });
            }

            // Render manual promises
            const manualPromisesElement = document.getElementById('manual-promises');
            
            if (manualPromises.length === 0) {
                manualPromisesElement.innerHTML = '<p>No manually tracked promises yet.</p>';
            } else {
                manualPromises.forEach(promise => {
                    const promiseElement = document.createElement('div');
                    promiseElement.className = 'promise-item';
                    promiseElement.innerHTML = `
                        <div class="promise-text">${promise.text}</div>
                        <div class="promise-source">${promise.date || 'Unknown date'}</div>
                        <span class="status ${promise.status}">${promise.status}</span>
                    `;
                    manualPromisesElement.appendChild(promiseElement);
                });
            }

            // In a real implementation, you'd have admin functionality
            // to update promises' status, add new ones, etc.
            // That would go here
        });
    </script>
</body>
</html>
