<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f8f5f0; /* cream color */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            font-weight: 500;
            font-size: 2rem;
            color: #333;
            margin-top: 2rem;
            margin-bottom: 2rem;
            text-transform: lowercase;
        }
        
        .timeline {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .flight-path {
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .flight-path path {
            fill: none;
            stroke: #666;
            stroke-width: 3px;
            stroke-linecap: round;
        }
        
        .box-container {
            display: flex;
            flex-direction: column;
            gap: 5rem;
            width: 100%;
            align-items: center;
            position: relative;
        }
        
        .box {
            width: 250px;
            height: 250px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            z-index: 2;
            border: 3px solid #FF8A3C;
            transition: border-color 0.3s ease;
        }
        
        .box:hover {
            border-color: #FF9F5B;
        }
        
        .box a {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .box:hover img {
            transform: scale(1.05);
        }
        
        .image-metadata {
            position: absolute;
            top: 10px;
            right: -280px;
            width: 250px;
            padding: 8px 12px;
            background-color: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 0.9rem;
            color: #aaa;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 25;
        }
        
        .box:hover .image-metadata {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <h1>neil</h1>
    
    <div class="timeline">
        <svg class="flight-path" preserveAspectRatio="none"></svg>
        
        <div class="box-container">
            <div class="box">
                <a href="https://neilwb.com/me">
                    <img src="alsoimages/me.png" alt="About me">
                    <div class="image-metadata">About me</div>
                </a>
            </div>
            
            <div class="box">
                <a href="https://neilwb.com/promise">
                    <img src="alsoimages/promise.png" alt="Promises">
                    <div class="image-metadata">Promises</div>
                </a>
            </div>
            
            <div class="box">
                <a href="https://neilwb.com/friends">
                    <img src="alsoimages/friendroll.png" alt="Friendroll">
                    <div class="image-metadata">Friendroll</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Generate a random bird-like flight path
            generateFlightPath();
            
            // Regenerate path when resizing
            window.addEventListener('resize', generateFlightPath);
        });
        
        function generateFlightPath() {
            const svg = document.querySelector('.flight-path');
            const boxes = document.querySelectorAll('.box');
            const boxContainer = document.querySelector('.box-container');
            
            // Clear previous path
            svg.innerHTML = '';
            
            // Set SVG dimensions
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', boxContainer.offsetHeight + 'px');
            
            // Create path element
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            svg.appendChild(path);
            
            // Calculate box positions
            const boxPositions = [];
            boxes.forEach(box => {
                const rect = box.getBoundingClientRect();
                const containerRect = boxContainer.getBoundingClientRect();
                boxPositions.push({
                    x: rect.left + rect.width / 2 - containerRect.left,
                    y: rect.top + rect.height / 2 - containerRect.top
                });
            });
            
            // Generate control points for smooth path
            let pathData = `M ${boxPositions[0].x} 0`;
            
            // First random point before first box
            const firstControlY = boxPositions[0].y * 0.3;
            const firstXOffset = Math.random() * 60 - 30;
            pathData += ` C ${boxPositions[0].x + firstXOffset} ${firstControlY}, ${boxPositions[0].x - 20} ${boxPositions[0].y - 20}, ${boxPositions[0].x} ${boxPositions[0].y}`;
            
            // Connect boxes with random control points
            for (let i = 0; i < boxPositions.length - 1; i++) {
                const startX = boxPositions[i].x;
                const startY = boxPositions[i].y;
                const endX = boxPositions[i+1].x;
                const endY = boxPositions[i+1].y;
                
                const midY = (startY + endY) / 2;
                
                // Random offsets for control points
                const maxOffset = 70;
                const c1xOffset = Math.random() * maxOffset - maxOffset/2;
                const c2xOffset = Math.random() * maxOffset - maxOffset/2;
                
                // Create smooth curve through control points
                pathData += ` S ${startX + c1xOffset} ${midY - 20}, ${endX} ${endY}`;
            }
            
            // Last segment to bottom
            const lastY = boxContainer.offsetHeight;
            const lastXOffset = Math.random() * 60 - 30;
            pathData += ` S ${boxPositions[boxPositions.length-1].x + lastXOffset} ${lastY * 0.8}, ${boxPositions[boxPositions.length-1].x} ${lastY}`;
            
            // Apply path data
            path.setAttribute('d', pathData);
        }
    </script>
</body>
</html>
