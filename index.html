<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f8f5f0; /* cream color */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            font-weight: 500;
            font-size: 2rem;
            color: #333;
            margin-top: 2rem;
            margin-bottom: 2rem;
            text-transform: lowercase;
        }
        
        .timeline {
            position: relative;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0 4rem;
        }
        
        .flight-path {
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .flight-path path {
            fill: none;
            stroke: #666;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-dasharray: 5, 8;
        }
        
        .box-container {
            display: flex;
            flex-direction: column;
            gap: 5rem;
            width: 100%;
            position: relative;
        }
        
        .box {
            width: 350px;
            height: 200px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            z-index: 2;
            border: 3px solid #8A2BE2; /* Purple */
            transition: border-color 0.3s ease, transform 0.3s ease;
        }
        
        .box:hover {
            border-color: #B19CD9; /* Lavender */
        }
        
        .box:nth-child(odd) {
            align-self: flex-start;
            transform: rotate(-2deg);
        }
        
        .box:nth-child(even) {
            align-self: flex-end;
            transform: rotate(2deg);
        }
        
        .box:hover {
            transform: rotate(0deg) scale(1.03);
        }
        
        .box a {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .box:hover img {
            transform: scale(1.05);
        }
        
        .image-metadata {
            position: absolute;
            top: 10px;
            right: -280px;
            width: 250px;
            padding: 8px 12px;
            background-color: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 0.9rem;
            color: #aaa;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 25;
        }
        
        .box:hover .image-metadata {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <h1>neil</h1>
    
    <div class="timeline">
        <svg class="flight-path" preserveAspectRatio="none"></svg>
        
        <div class="box-container">
            <div class="box">
                <a href="https://neilwb.com/me">
                    <img src="alsoimages/Me.png" alt="About Me">
                    <div class="image-metadata">About Me</div>
                </a>
            </div>
            
            <div class="box">
                <a href="https://neilwb.com/promise">
                    <img src="alsoimages/Promise.png" alt="Promises">
                    <div class="image-metadata">Promises</div>
                </a>
            </div>
            
            <div class="box">
                <a href="https://neilwb.com/friends">
                    <img src="alsoimages/Friendroll.png" alt="Friendroll">
                    <div class="image-metadata">Friendroll</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Generate a random bird-like flight path
            generateFlightPath();
            
            // Regenerate path when resizing
            window.addEventListener('resize', generateFlightPath);
        });
        
        function generateFlightPath() {
            const svg = document.querySelector('.flight-path');
            const boxes = document.querySelectorAll('.box');
            const boxContainer = document.querySelector('.box-container');
            
            // Clear previous path
            svg.innerHTML = '';
            
            // Set SVG dimensions
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', boxContainer.offsetHeight + 'px');
            
            // Create path element
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            svg.appendChild(path);
            
            // Calculate box positions
            const boxPositions = [];
            boxes.forEach(box => {
                const rect = box.getBoundingClientRect();
                const containerRect = boxContainer.getBoundingClientRect();
                boxPositions.push({
                    x: rect.left + rect.width / 2 - containerRect.left,
                    y: rect.top + rect.height / 2 - containerRect.top
                });
            });
            
            // More organic bird-like path
            const containerWidth = boxContainer.offsetWidth;
            const segmentsPerSection = 4; // Number of curve segments between boxes
            
            let pathData = '';
            
            // Start point at the top
            const startX = boxPositions[0].x + (Math.random() * 40 - 20);
            pathData = `M ${startX} 0`;
            
            // Helper function to add organic curve segments
            function addOrganicSegments(startX, startY, endX, endY, segments) {
                let currentX = startX;
                let currentY = startY;
                
                const dx = (endX - startX) / segments;
                const dy = (endY - startY) / segments;
                
                for (let i = 0; i < segments; i++) {
                    // Target for this segment
                    const targetX = startX + dx * (i + 1);
                    const targetY = startY + dy * (i + 1);
                    
                    // Random control points for natural curve
                    const spread = Math.min(Math.abs(dx), 100) * 0.8; // Adjust spread based on distance
                    
                    // More vertical variation for bird-like flight
                    const verticalVariation = Math.min(Math.abs(dy), 60) + 20;
                    
                    // Make the curves more random and swooping
                    const cp1x = currentX + (Math.random() * spread * 0.8 - spread * 0.4);
                    const cp1y = currentY + (Math.random() * verticalVariation * 0.7 - verticalVariation * 0.3);
                    
                    const cp2x = targetX - (Math.random() * spread * 0.8 - spread * 0.4);
                    const cp2y = targetY - (Math.random() * verticalVariation * 0.7 - verticalVariation * 0.3);
                    
                    // Add the curve segment
                    pathData += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${targetX} ${targetY}`;
                    
                    // Update current position
                    currentX = targetX;
                    currentY = targetY;
                }
                
                return { x: currentX, y: currentY };
            }
            
            // Connect to first box with natural approach
            let current = { x: startX, y: 0 };
            current = addOrganicSegments(
                current.x, current.y, 
                boxPositions[0].x, boxPositions[0].y, 
                2
            );
            
            // Connect between boxes
            for (let i = 0; i < boxPositions.length - 1; i++) {
                // Add swooping path between each box
                current = addOrganicSegments(
                    boxPositions[i].x, boxPositions[i].y,
                    boxPositions[i+1].x, boxPositions[i+1].y,
                    segmentsPerSection
                );
            }
            
            // Connect to bottom with gentle descent
            const bottomY = boxContainer.offsetHeight;
            addOrganicSegments(
                boxPositions[boxPositions.length-1].x, boxPositions[boxPositions.length-1].y,
                boxPositions[boxPositions.length-1].x + (Math.random() * 40 - 20), bottomY,
                2
            );
            
            // Apply path data
            path.setAttribute('d', pathData);
        }
    </script>
</body>
</html>
