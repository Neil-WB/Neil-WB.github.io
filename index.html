<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neil Warren-Bancquart</title>
    <style>
        body { 
            margin: 0; 
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 400px;
            height: 600px;
            position: absolute;
            transition: all 0.3s ease-out;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .card-content {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.6));
            color: white;
            font-size: 1.25rem;
            text-align: center;
        }
        .instruction {
            position: fixed;
            bottom: 1rem;
            color: #9ca3af;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div id="card-container"></div>
    <div class="instruction">Press spacebar to continue</div>

    <script>
        const cards = [
            { 
                text: "neil warren-bancquart",
                bgImage: "path/to/your/image1.jpg"
            },
            { 
                text: "do it now. it's just you and your future self",
                bgImage: "path/to/your/image2.jpg"
            },
            // add more cards here
        ];

        let shuffledCards = [...cards].sort(() => Math.random() - 0.5);
        let visibleCount = 1;
        let isResetting = false;

        function renderCards() {
            const container = document.getElementById('card-container');
            container.innerHTML = '';
            
            for(let i = 0; i < visibleCount; i++) {
                const card = shuffledCards[i];
                const div = document.createElement('div');
                div.className = 'card';
                div.style.transform = `rotate(${(i % 2 === 0 ? 1 : -1) * 3}deg) translateY(${i * 0.5}px)`;
                div.style.zIndex = i;
                div.style.backgroundImage = `url(${card.bgImage})`;
                
                const content = document.createElement('div');
                content.className = 'card-content';
                content.textContent = card.text;
                
                div.appendChild(content);
                container.appendChild(div);
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                
                if (visibleCount === shuffledCards.length && !isResetting) {
                    isResetting = true;
                    const timer = setInterval(() => {
                        visibleCount--;
                        renderCards();
                        if (visibleCount <= 1) {
                            clearInterval(timer);
                            shuffledCards = [...cards].sort(() => Math.random() - 0.5);
                            isResetting = false;
                        }
                    }, 200);
                } else if (!isResetting) {
                    visibleCount = Math.min(visibleCount + 1, shuffledCards.length);
                    renderCards();
                }
            }
        });

        renderCards();
    </script>
</body>
</html>
