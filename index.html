<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neil</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>

// Preload images
const cards = [
    {
        text: `To learn about fountain pens, contact an <a href="https://gitxperimenter.github.io/" style="color: #FF8A3C; text-decoration: underline;">expert</a>.`,
        bgImage: 'alsoimages/frog procession.jpeg'
    },
    {
        text: `check out the website of my good friend NATHAN of the NGUYEN dynasty: <a href="http://nathanfish.fr" style="color: #FF8A3C; text-decoration: underline;">nathanfish.fr</a>. ask him about his MOLA MOLA fish`,
        bgImage: 'alsoimages/moebius ocean.jpg'
    },
    {
        text: `would be remiss not to mention sudarsh 🦫 and the serendipitously acquired <a href="https://sudarsh.com" style="color: #FF8A3C; text-decoration: underline;">SUDARSH.COM</a>`,
        bgImage: 'alsoimages/solarpunk2.jpg'
    },
    {
        text: `For some reason whenever you ask for something unconventional, you'll oft get it. Exerce the power of the <a href="https://x.com/nearcyan/status/1724897162285416601" style="color: #FF8A3C; text-decoration: underline;">COLD EMAIL</a>.`,
        bgImage: 'alsoimages/church again.jpg'
    }
];

// Game state
let currentCard = -1;
let hasDrawnFirstCard = false;

// Cache DOM elements
const table = document.querySelector('.table');
const prompt = document.querySelector('.prompt');
const name = document.querySelector('.name');
const gameContainer = document.querySelector('.game-container');

// Preload images
cards.forEach(card => {
    const img = new Image();
    img.src = card.bgImage;
});

// Initialize first background
document.addEventListener('DOMContentLoaded', () => {
    gameContainer.style.backgroundImage = `url('${cards[0].bgImage}')`;
    gameContainer.style.opacity = '0';
    setTimeout(() => gameContainer.style.opacity = '1', 100);
});

// Card drawing logic
function drawCard() {
    if (!hasDrawnFirstCard) {
        prompt.style.opacity = '0';
        name.style.opacity = '1';
        hasDrawnFirstCard = true;
    }

    currentCard = (currentCard + 1) % cards.length;
    
    const card = createCard(cards[currentCard]);
    updateBackground(cards[currentCard].bgImage);
    maintainCardLimit();
    animateCards();
}

function createCard(cardData) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="content">${cardData.text}</div>`;
    
    // Initial position for animation
    card.style.transform = `translateY(120%) translateX(50%) rotateZ(${getRotationAngle(table.children.length) + 15}deg)`;
    
    table.appendChild(card);
    return card;
}

function updateBackground(bgImage) {
    setTimeout(() => {
        gameContainer.style.transition = 'background-image 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
        gameContainer.style.backgroundImage = bgImage ? `url('${bgImage}')` : 'none';
        gameContainer.style.backgroundSize = 'cover';
        gameContainer.style.backgroundPosition = 'center';
    }, 100);
}

function maintainCardLimit() {
    if (table.children.length > 5) {
        table.removeChild(table.children[0]);
    }
}

function getRotationAngle(position) {
    const fanAngle = 24;
    const anglePerCard = fanAngle / 4;
    return -fanAngle/2 + (anglePerCard * position);
}

function animateCards() {
    setTimeout(() => {
        Array.from(table.children).forEach((card, index) => {
            card.style.transform = `rotateZ(${getRotationAngle(index)}deg)`;
        });
    }, 50);
}

// Event listeners
document.addEventListener('click', (e) => {
    if (e.target.tagName !== 'A') {
        e.preventDefault();
        drawCard();
    }
});

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        drawCard();
    }
});
    </script>
</body>
</html>
