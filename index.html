<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>neil</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* Base styles */
        :root {
            --card-transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            --mobile-transition: 0.2s ease;
        }

        body { 
            margin: 0;
            font-family: 'VT323', monospace;
            min-height: 100dvh;
            background: #000;
            color: #fff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            width: 100dvw;
            height: 100dvh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 100%);
            transition: all var(--card-transition);
            overflow: hidden;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8));
            pointer-events: none;
        }

        .prompt {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: opacity 0.5s ease;
            text-align: center;
            white-space: nowrap;
        }

        
.subprompt {
    display: block;
    font-size: 24px;
    opacity: 0.7;
    text-align: left;
    margin-left: 0;
    margin-top: 8px;
}

        .name-container {
            position: absolute;
            top: 8%;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .name {
            font-size: 32px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            letter-spacing: 2px;
            opacity: 0;
            transition: text-shadow 0.5s ease;
        }

        .name:hover {
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        .table {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            perspective: 2000px;
            width: 90vw;
            height: 70vh;
        }

        .card {
            width: 500px;
            height: 700px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 25px;
            padding: 40px;
            position: absolute;
            left: calc(50% - 250px);
            bottom: 0;
            transform-style: preserve-3d;
            transform-origin: bottom center;
            transition: all var(--card-transition);
            box-shadow: 0 0 30px rgba(0,255,255,0.1);
        }

        .content {
            font-size: 32px;
            text-align: center;
            line-height: 1.6;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
        }

        .card:hover {
            box-shadow: 0 0 50px rgba(0,255,255,0.2);
        }

        .menu-card {
            width: 500px;
            height: 700px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 25px;
            padding: 40px;
            position: absolute;
            left: calc(50% - 250px);
            bottom: -800px;
            transform-style: preserve-3d;
            transform-origin: bottom center;
            transition: all var(--card-transition);
            box-shadow: 0 0 30px rgba(0,255,255,0.1);
            z-index: 1000;
        }

        .menu-card.active {
            bottom: 100px;
        }

        .menu-item {
            opacity: 0;
            color: #FF8A3C;
            margin: 30px 0;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 32px;
            text-align: center;
        }

        .menu-item:before {
            content: '> ';
            opacity: 0.5;
        }

        .menu-item:hover {
            text-shadow: 0 0 5px rgba(255,138,60,0.6);
        }

        .crt-lines {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                transparent 50%, 
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        .crt-flicker {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.02);
            opacity: 0;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.1; }
            50% { opacity: 0; }
            100% { opacity: 0.1; }
        }

        @media (max-width: 768px) {
            .game-container {
                height: 100dvh;
                width: 100dvw;
            }

            .card, .menu-card {
                width: 85vw;
                height: 75vh;
                left: 7.5vw;
                padding: 20px;
                transition: all var(--mobile-transition);
            }

            .menu-card.active {
                bottom: 12.5vh;
            }

            .table {
                bottom: 0;
                height: 85vh;
                width: 100vw;
            }

            .prompt {
                font-size: 24px;
                width: 90%;
                white-space: normal;
            }

            .subprompt {
                font-size: 18px;
                margin-top: 8px;
            }

            .subprompt::before {
                content: 'swipe up for menu';
            }

            .content {
                font-size: 24px;
            }

            .menu-item {
                font-size: 28px;
                margin: 40px 0;
            }

            * {
                touch-action: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="vignette"></div>
        <div class="prompt">press [space] to draw<br><span class="subprompt">[enter] for menu</span></div>
        <div class="name-container">
            <div class="name">neil</div>
        </div>
        <div class="table"></div>
        <div class="crt-lines"></div>
        <div class="crt-flicker"></div>
    </div>

    <script>
        const cards = [
            {
                text: `Expert in all things fountain pen, <a href="https://gitxperimenter.github.io/" style="color: #FF8A3C; text-decoration: underline;">DONUTLORD</a>.`,
                bgImage: 'alsoimages/frog procession.jpeg'
            },
            {
                text: `NATHAN of the NGUYEN dynasty: <a href="http://nathanfish.fr" style="color: #FF8A3C; text-decoration: underline;">nathanfish.fr</a>. ask him about his MOLA MOLA fish`,
                bgImage: 'alsoimages/moebius ocean.jpg'
            },
            {
                text: `would be remiss not to mention sudarsh 🦫 and the serendipitously acquired <a href="https://sudarsh.com" style="color: #FF8A3C; text-decoration: underline;">SUDARSH.COM</a>`,
                bgImage: 'alsoimages/solarpunk.jpg'
            },
        ];

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        const els = {
            table: document.querySelector('.table'),
            prompt: document.querySelector('.prompt'),
            name: document.querySelector('.name'),
            nameContainer: document.querySelector('.name-container'),
            gameContainer: document.querySelector('.game-container')
        };

        const state = {
            currentCard: -1,
            hasDrawnFirstCard: false,
            menuCard: null,
            touchStart: null
        };

        // Preload images
        cards.forEach(card => {
            if (card.bgImage) {
                const img = new Image();
                img.src = card.bgImage;
            }
            // Preload menu background
const menuImg = new Image();
menuImg.src = 'alsoimages/boat.jpg';
        });

        function showMenu() {
            if (!state.menuCard) {
                els.gameContainer.style.backgroundImage = 'url("alsoimages/boat.jpg")';
                els.gameContainer.style.backgroundSize = 'cover';
                
                state.menuCard = document.createElement('div');
                state.menuCard.className = 'menu-card';
                state.menuCard.innerHTML = `
                    <div class="menu-item">about/</div>
                    <div class="menu-item">projects/</div>
                    <div class="menu-item">thoughts.md</div>
                `;
                document.body.appendChild(state.menuCard);
                setTimeout(() => state.menuCard.classList.add('active'), 50);
                
                const items = state.menuCard.querySelectorAll('.menu-item');
                items.forEach((item, i) => {
                    setTimeout(() => item.style.opacity = '1', 150 * (i + 1));
                });
            }
        }

        function hideMenu() {
            if (state.menuCard) {
                state.menuCard.classList.remove('active');
                setTimeout(() => {
                    state.menuCard.remove();
                    state.menuCard = null;
                }, isMobile ? 200 : 600);
            }
        }

function drawCard() {
    if (!state.hasDrawnFirstCard) {
        // Fade out prompt
        els.prompt.style.transition = 'opacity 0.3s ease';
        els.prompt.style.opacity = '0';
        
        // Fade in name with slight delay
        setTimeout(() => {
            els.name.style.transition = 'opacity 0.4s ease';
            els.name.style.opacity = '1';
        }, 200);
        
        state.hasDrawnFirstCard = true;
        
        // Start card animation after name fade-in
        setTimeout(createAndAnimateNewCard, 300);
    } else {
        createAndAnimateNewCard();
    }
}

// Split out the card creation logic
function createAndAnimateNewCard() {
    state.currentCard = (state.currentCard + 1) % cards.length;
    const card = createCard(cards[state.currentCard]);
    updateBackground(cards[state.currentCard].bgImage);
    maintainCardLimit();
    animateCards();
}
        function createCard(cardData) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="content">${cardData.text}</div>`;
            card.style.transform = `translateY(120%) translateX(50%) rotateZ(${getRotationAngle(els.table.children.length) + 15}deg)`;
            els.table.appendChild(card);
            return card;
        }

        function updateBackground(bgImage) {
            setTimeout(() => {
                els.gameContainer.style.transition = `background-image ${isMobile ? 0.2 : 0.4}s cubic-bezier(0.2, 0.8, 0.2, 1)`;
                els.gameContainer.style.backgroundImage = bgImage ? `url('${bgImage}')` : 'none';
                els.gameContainer.style.backgroundSize = 'cover';
                els.gameContainer.style.backgroundPosition = 'center';
            }, 100);
        }

        function maintainCardLimit() {
            if (els.table.children.length > 5) {
                els.table.removeChild(els.table.children[0]);
            }
        }

        function getRotationAngle(position) {
            const fanAngle = 24;
            const anglePerCard = fanAngle / 4;
            return -fanAngle/2 + (anglePerCard * position);
        }

        function animateCards() {
            setTimeout(() => {
                Array.from(els.table.children).forEach((card, index) => {
                    card.style.transform = `rotateZ(${getRotationAngle(index)}deg)`;
                });
            }, 50);
        }

       if ('ontouchstart' in window) {  // Better touch detection
    let touchStartY = null;
    let touchStartX = null;
    
    document.addEventListener('touchstart', e => {
        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
        console.log('Touch started:', touchStartY); // Debug
    }, { passive: false });

    document.addEventListener('touchmove', e => {
        e.preventDefault(); // Prevent scroll interference
    }, { passive: false });

    document.addEventListener('touchend', e => {
        if (touchStartY === null) return;
        
        const touchEndY = e.changedTouches[0].clientY;
        const touchEndX = e.changedTouches[0].clientX;
        
        const diffY = touchStartY - touchEndY;
        const diffX = Math.abs(touchStartX - touchEndX);
        
        console.log('Swipe distance Y:', diffY); // Debug
        console.log('Swipe distance X:', diffX); // Debug
        
        // More lenient threshold (30px instead of 50px)
        // Also check if vertical swipe is more prominent than horizontal
        if (diffY > 30 && diffY > diffX && !state.menuCard) {
            console.log('Swipe detected, showing menu'); // Debug
            showMenu();
        }
        
        touchStartY = null;
        touchStartX = null;
    }, { passive: false });
}

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            els.gameContainer.style.backgroundImage = 'none';
            els.gameContainer.style.opacity = '0';
            setTimeout(() => els.gameContainer.style.opacity = '1', 100);
        });

        // Event listeners
        document.addEventListener('click', (e) => {
            if (e.target.tagName !== 'A') {
                e.preventDefault();
                if (state.menuCard && !state.menuCard.contains(e.target)) {
                    hideMenu();
                }
                if (!e.target.closest('.menu-card')) {
                    drawCard();
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || (e.code === 'Enter' && state.menuCard)) {
                e.preventDefault();
                if (state.menuCard) hideMenu();
                drawCard();
            } else if (e.code === 'Enter' || e.code === 'Tab' || e.key.toLowerCase() === 'm') {
                e.preventDefault();
                if (!state.menuCard) showMenu();
            }
        });
    </script>
</body>
</html>
