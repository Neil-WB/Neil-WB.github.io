<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>neil</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* Base styles */
        :root {
            --text-font-size: 32px; /* Default font size for text */
            --text-color: #fff;     /* Default text color */
            --card-transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            --mobile-transition: 0.2s ease;
            --card-width: 310px;
            --card-height: 435px;
            --card-padding: 29px;
        }

        body {
            margin: 0;
            font-family: 'VT323', monospace;
            min-height: 100dvh;
            background: #000;
            color: var(--text-color);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            width: 100dvw;
            height: 100dvh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 100%);
            transition: all var(--card-transition);
            overflow: hidden;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8));
            pointer-events: none;
        }

        .prompt {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: var(--text-font-size); /* Use CSS variable for font size */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: opacity 0.5s ease;
            text-align: center;
            white-space: normal; /* Allow text to wrap if needed */
        }

  


 

        
.subprompt {
    display: block;
    font-size: 24px;
    opacity: 0.7;
    text-align: left;
    margin-left: 0;
    margin-top: 8px;
}
.subprompt::before {
    content: '[enter] for menu';
}

@media (max-width: 768px) {
:root {
    --card-width: 380px;    /* up from 310px */
    --card-height: 535px;   /* up from 435px */
    --card-padding: 29px;
   --text-font-size: 24px; /* Smaller font size for mobile - applies to both! */
}
 
    .subprompt::before {
        content: '[swipe up] for menu';
    }
    .subprompt {
        text-align: center;  /* this helps with mobile alignment */
    }
}

.name-container {
    position: absolute;
    top: 8%;
    left: 0;
    width: 100%;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.name {
    font-size: var(--text-font-size); /* Use CSS variable for font size */
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    letter-spacing: 2px;
    transition: opacity 0.5s ease;
    text-align: center;
    white-space: nowrap;
    color: var(--text-color);
    opacity: 0;  /* will be faded in by JS */
}

/* Remove any duplicate .name-container or .name definitions later in the CSS */

        .table {
            position: absolute;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            perspective: 2000px;
            width: 90vw;
            height: 90vh;
        }




/* Shared card properties */
.card, .menu-card {
   width: var(--card-width);
   height: var(--card-height);
   padding: var(--card-padding);
   background: #1a1a1a;
   border: 2px solid #333;
   border-radius: 25px;
   position: absolute;
   left: calc(50% - var(--card-width) / 2);
   transform-style: preserve-3d;
   transform-origin: bottom center;
   transition: all var(--card-transition);
   box-shadow: 0 0 30px rgba(0,255,255,0.1);
}

/* Card specific */
.card {
   bottom: 10px;  /* makes cards peek from bottom */
}

.card:hover {
   box-shadow: 0 0 50px rgba(0,255,255,0.2);
}

.content {
   font-size: 32px;  /* restored original font size */
   text-align: center;
   line-height: 1.6;
   position: relative;
   top: 50%;
   transform: translateY(-50%);
}

/* Menu card specific */
.menu-card {
   bottom: -800px;  /* starts way off-screen for smooth entry */
   z-index: 1001;   /* ensures it's above ALL other elements */
   transform-origin: center bottom;  /* smooth slide up animation */
}

.menu-card.active {
   bottom: 20px;    /* slides up to just above the other cards */
   transform: translateZ(50px);  /* subtle 3D effect to emphasize it's on top */
}

.menu-item {
   opacity: 0;
   color: #FF8A3C;
   margin: 30px 0;
   cursor: pointer;
   transition: all 0.2s;
   font-size: 32px;  /* same as regular card content */
   text-align: center;
}

.menu-item:before {
   content: '> ';
   opacity: 0.5;
}

.menu-item:hover {
   text-shadow: 0 0 5px rgba(255,138,60,0.6);
}

/* Mobile adjustments */
@media (max-width: 768px) {
    .menu-card.active {
        bottom: 10px;  /* slightly lower on mobile */
    }
    
    .menu-item {
        font-size: 28px;
        margin: 30px 0;
    }
}
        .crt-lines {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                transparent 50%,
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        .crt-flicker {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.02);
            opacity: 0;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.1; }
            50% { opacity: 0; }
            100% { opacity: 0.1; }
        }

     

        @media (max-width: 768px) {
            .game-container {
                height: 100dvh;
                width: 100dvw;
            }

         
/* menu positioning adjustment */
.menu-card.active {
    bottom: 80px !important;
}

            .table {
                bottom: 0;
                height: 85vh;
                width: 100vw;
            }

            .prompt {
                font-size: 24px;
                width: 90%;
                white-space: normal;
            }

            .subprompt {
                font-size: 18px;
                margin-top: 8px;
            }

            .subprompt::before {
                content: 'swipe up for menu';
            }

            .content {
                font-size: 24px;
            }

            .menu-item {
                font-size: 28px;
                margin: 40px 0;
            }

            * {
                touch-action: none;
            }



.game-container .menu-card.active {
    bottom: 80px !important;
}
        
    </style>
</head>
<body>
    <div class="game-container">
        <div class="name-container">
            <div class="name">neil</div>
        </div>
        <div class="vignette"></div>
        <div class="prompt">press [space] to draw<br><span class="subprompt"></span></div>        <div class="table"></div>
        <div class="crt-lines"></div>
        <div class="crt-flicker"></div>
    </div>

    <script>
        const cards = [
            {
                text: `Expert in all things fountain pen, <a href="https://gitxperimenter.github.io/" style="color: #FF8A3C; text-decoration: underline;">DONUTLORD</a>.`,
                bgImage: 'alsoimages/frog procession.jpeg'
            },
            {
                text: `NATHAN of the NGUYEN dynasty: <a href="http://nathanfish.fr" style="color: #FF8A3C; text-decoration: underline;">nathanfish.fr</a>. ask him about his MOLA MOLA fish`,
                bgImage: 'alsoimages/moebius ocean.jpg'
            },
            {
                text: `would be remiss not to mention sudarsh 🦫 and the serendipitously acquired <a href="https://sudarsh.com" style="color: #FF8A3C; text-decoration: underline;">SUDARSH.COM</a>`,
                bgImage: 'alsoimages/solarpunk.jpg'
            },

             {
                text: `socratica / rl stuff, accessible by carrior pigeon only, <a href="https://lydianottingham.com" style="color: #FF8A3C; text-decoration: underline;">LYDIA</a>`,
                bgImage: 'alsoimages/birds.png'
            },

            {
                text: `crazy russian, NIH archnemesis, now sleeps a normal amount of hours, <a href="https://guzey.com" style="color: #FF8A3C; text-decoration: underline;">ALEXEY</a>`,
                bgImage: 'alsoimages/death.jpg'
            },

             {
                text: `timor mortis conturbat eum, YouTuber <br> <a href="https://gleech.org" style="color: #FF8A3C; text-decoration: underline;">GAVIN</a>`,
                bgImage: 'alsoimages/visualmodality.png'
            },

            {
                text: `wise in a curiuos way, Watts appreciator, good conversationalist: <br> <a href="https://pacificvoyages.net" style="color: #FF8A3C; text-decoration: underline;">JAMIS</a>`,
                bgImage: 'alsoimages/flammarion.png'
            },

            {
                    text: `<span style="font-family: 'Comic Sans MS', cursive;">woods dweller, nicotine addict, email yapper, <a href="https://gwern.net" style="color: #FF1493; text-decoration: underline;">GWERN</a></span>`,
                    bgImage: 'alsoimages/jumbocoloringpad.webp'
                },


             {
                text: `cool neuro stuff, impeccable vibes, iPhone user: <a href="https://www.clairebookworm.com/" style="color: #FF8A3C; text-decoration: underline;">CLAIRE WANG.</a>`,
                bgImage: 'alsoimages/terrace.jpg'
            },

             {
                text: `claude elitist, free associative, avoids bad status gamess<a href="https://near.blog" style="color: #FF8A3C; text-decoration: underline;">near</a>`,
                bgImage: 'alsoimages/near.jpg'
            },
    
        ];

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        const els = {
            table: document.querySelector('.table'),
            prompt: document.querySelector('.prompt'),
            name: document.querySelector('.name'),
            nameContainer: document.querySelector('.name-container'),
            gameContainer: document.querySelector('.game-container')
        };

        const state = {
            currentCard: -1,
            hasDrawnFirstCard: false,
            menuCard: null,
            touchStart: null
        };

      cards.forEach(card => {
    if (card.bgImage) {
        const img = new Image();
        img.src = card.bgImage;
    }
});

// Preload menu background
const menuImg = new Image();
menuImg.src = 'alsoimages/winter.jpg';

        function showMenu() {
            if (!state.menuCard) {
                els.gameContainer.style.backgroundImage = 'url("alsoimages/winter.jpg")';
                els.gameContainer.style.backgroundSize = 'cover';
                
                state.menuCard = document.createElement('div');
                state.menuCard.className = 'menu-card';
                state.menuCard.innerHTML = `
                    <div class="menu-item"><a href="https://neilwb.me">me<a/></div>
                    <div class="menu-item">grants</div>
                    <div class="menu-item"><a href:"https://neilwb.com/abysmal-research">abysmal research<a/></div>
                `;
                document.body.appendChild(state.menuCard);
                setTimeout(() => state.menuCard.classList.add('active'), 50);
                
                const items = state.menuCard.querySelectorAll('.menu-item');
                items.forEach((item, i) => {
                    setTimeout(() => item.style.opacity = '1', 150 * (i + 1));
                });
            }
        }

        function hideMenu() {
            if (state.menuCard) {
                state.menuCard.classList.remove('active');
                setTimeout(() => {
                    state.menuCard.remove();
                    state.menuCard = null;
                }, isMobile ? 200 : 600);
            }
        }

function drawCard() {
    if (!state.hasDrawnFirstCard) {
        // Fade out prompt
        els.prompt.style.transition = 'opacity 0.3s ease';
        els.prompt.style.opacity = '0';

        // Debug - force name visibility
        els.name.style.opacity = '1';
        console.log('Name element:', els.name); // debug

        state.hasDrawnFirstCard = true;
        setTimeout(createAndAnimateNewCard, 300);
    } else {
        createAndAnimateNewCard();
    }
}

// Split out the card creation logic
function createAndAnimateNewCard() {
    state.currentCard = (state.currentCard + 1) % cards.length;
    const card = createCard(cards[state.currentCard]);
    updateBackground(cards[state.currentCard].bgImage);
    maintainCardLimit();
    animateCards();
}
        function createCard(cardData) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="content">${cardData.text}</div>`;
            card.style.transform = `translateY(120%) translateX(50%) rotateZ(${getRotationAngle(els.table.children.length) + 15}deg)`;
            els.table.appendChild(card);
            return card;
        }

        function updateBackground(bgImage) {
            setTimeout(() => {
                els.gameContainer.style.transition = `background-image ${isMobile ? 0.2 : 0.4}s cubic-bezier(0.2, 0.8, 0.2, 1)`;
                els.gameContainer.style.backgroundImage = bgImage ? `url('${bgImage}')` : 'none';
                els.gameContainer.style.backgroundSize = 'cover';
                els.gameContainer.style.backgroundPosition = 'center';
            }, 100);
        }

        function maintainCardLimit() {
            if (els.table.children.length > 5) {
                els.table.removeChild(els.table.children[0]);
            }
        }

        function getRotationAngle(position) {
            const fanAngle = 24;
            const anglePerCard = fanAngle / 4;
            return -fanAngle/2 + (anglePerCard * position);
        }

        function animateCards() {
            setTimeout(() => {
                Array.from(els.table.children).forEach((card, index) => {
                    card.style.transform = `rotateZ(${getRotationAngle(index)}deg)`;
                });
            }, 50);
        }
if ('ontouchstart' in window) {  // Better touch detection
    let touchStartY = null;
    let touchStartX = null;
    
    document.addEventListener('touchstart', e => {
        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
    }, { passive: false });

    document.addEventListener('touchmove', e => {
        e.preventDefault(); // Prevent scroll interference
    }, { passive: false });

    document.addEventListener('touchend', e => {
        if (touchStartY === null) return;
        
        const touchEndY = e.changedTouches[0].clientY;
        const touchEndX = e.changedTouches[0].clientX;
        
        const diffY = touchStartY - touchEndY;  // positive = up swipe, negative = down swipe
        const diffX = Math.abs(touchStartX - touchEndX);
        
        // Check if vertical swipe is more prominent than horizontal
        if (Math.abs(diffY) > diffX) {
            if (diffY > 30 && !state.menuCard) {
                // Swipe up - show menu
                showMenu();
            } else if (diffY < -30 && state.menuCard) {
                // Swipe down - hide menu and draw card
                hideMenu();
                drawCard();
            }
        }
        
        touchStartY = null;
        touchStartX = null;
    }, { passive: false });
}

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            els.gameContainer.style.backgroundImage = 'none';
            els.gameContainer.style.opacity = '0';
            setTimeout(() => els.gameContainer.style.opacity = '1', 100);
        });

        // Event listeners
        document.addEventListener('click', (e) => {
            if (e.target.tagName !== 'A') {
                e.preventDefault();
                if (state.menuCard && !state.menuCard.contains(e.target)) {
                    hideMenu();
                }
                if (!e.target.closest('.menu-card')) {
                    drawCard();
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || (e.code === 'Enter' && state.menuCard)) {
                e.preventDefault();
                if (state.menuCard) hideMenu();
                drawCard();
            } else if (e.code === 'Enter' || e.code === 'Tab' || e.key.toLowerCase() === 'm') {
                e.preventDefault();
                if (!state.menuCard) showMenu();
            }
        });


// Function to check if the page is being visited by Gwern (via URL parameter)
function checkForGwern() {
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('for') && urlParams.get('for') === 'gwern') {
        // Create the Gwern popup
        const popup = document.createElement('div');
        popup.style.position = 'fixed';
        popup.style.top = '50%';
        popup.style.left = '50%';
        popup.style.transform = 'translate(-50%, -50%)';
        popup.style.width = '80%';
        popup.style.maxWidth = '500px';
        popup.style.background = '#FF66CC';
        popup.style.zIndex = '9999';
        popup.style.border = '8px ridge gold';
        popup.style.padding = '20px';
        popup.style.boxShadow = '0 0 50px #FF00FF';
        popup.style.fontFamily = '"Comic Sans MS", cursive';
        popup.style.textAlign = 'center';
        
        // Set popup content first
        popup.innerHTML = `
            <img src="alsoimages/hamster.gif" style="width: 150px; margin-bottom: 10px;">
            <h2 style="color: blue; text-shadow: 2px 2px yellow;">WELCOME GWERN BRANWEN!</h2>
            <p>We detected your commitment to minimalist typography!</p>
            <p style="font-size: 24px; color: red;">This special popup is for YOU!</p>
            <div style="background: yellow; padding: 5px; margin: 10px 0;">
                <marquee>Isn't Comic Sans just the BEST font for research?</marquee>
            </div>
            <p style="font-size: 10px;">press space to continue, or click the tiny x if you can find it</p>
        `;
        
        // Add a tiny X in the corner after setting innerHTML
        const closeBtn = document.createElement('div');
        closeBtn.innerHTML = 'x';
        closeBtn.style.position = 'absolute';
        closeBtn.style.top = '2px';
        closeBtn.style.right = '5px';
        closeBtn.style.fontSize = '10px';
        closeBtn.style.cursor = 'pointer';
        closeBtn.style.color = 'black';
        closeBtn.onclick = function(e) {
            e.stopPropagation(); // Prevent triggering card draw
            popup.remove();
        };
        popup.appendChild(closeBtn);
        
        document.body.appendChild(popup);
        
        // Store reference to original drawCard function
        const originalDrawCard = drawCard;
        
        // Replace the global drawCard function
        window.drawCard = function() {
            if (document.body.contains(popup)) {
                popup.remove();
            }
            originalDrawCard();
        };
    }
}

// Call checkForGwern after the DOM is fully loaded
document.addEventListener('DOMContentLoaded', checkForGwern);
    </script>
</body>
</html>
