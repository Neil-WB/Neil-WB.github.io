<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neil.cards</title>
    
    <!-- retro terminal font - feel free to change -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* BASE STYLES */
        body { 
            margin: 0;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        /* CONTAINER AND EFFECTS */
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* ADD YOUR BACKGROUND IMAGE HERE */
            background: #000;
        }
        
        /* dark edges effect */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8));
            pointer-events: none;
        }

        /* retro screen effects */
        .crt-lines {
            position: fixed;
            inset: 0;
            background: linear-gradient(transparent 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
        .crt-flicker {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.02);
            opacity: 0;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        /* CARD POSITIONING */
        .table {
            position: absolute;
            bottom: -30%; /* hides bottom portion of cards */
            left: 50%;
            transform: translateX(-50%);
            perspective: 1500px;
            width: 100vw;
            height: 100vh;
        }

        /* CARD STYLING */
        .card {
            /* Large cards that scale with viewport */
            width: min(90vw, 600px);
            height: min(70vh, 800px);
            
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            position: absolute;
            left: 50%;
            bottom: 0;
            transform-style: preserve-3d;
            transform-origin: bottom center;
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 20px rgba(0,255,255,0.1);
        }

        /* TITLE/PROMPT STYLING */
        .prompt {
            position: fixed;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: min(24px, 5vw);
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 100;
        }

        /* CARD CONTENT */
        .content {
            font-size: min(24px, 5vw);
            text-align: center;
            line-height: 1.6;
            padding: 2rem;
        }

        /* ANIMATIONS */
        @keyframes flicker {
            0% { opacity: 0.1; }
            50% { opacity: 0; }
            100% { opacity: 0.1; }
        }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            .card {
                width: 85vw;
                height: 60vh;
            }
            .table {
                bottom: -20%;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="vignette"></div>
        <div class="prompt">press [space] to draw</div>
        <div class="table"></div>
        <div class="crt-lines"></div>
        <div class="crt-flicker"></div>
    </div>

    <script>
        // ==============================================
        // CARD CONTENT - ADD YOUR CARDS HERE
        // ==============================================
        const cards = [
            {
                text: "neil warren-bancquart",
                style: "color: #fff; font-size: 2em;" // optional custom styling
            },
            {
                text: "do it now. it's just you and your future self",
                style: "color: #0ff;"
            },
            {
                text: "send cold emails. make them 2 sentences.",
                style: "color: #fff;"
            },
            // Add more cards here! Format:
            // { text: "your text", style: "optional css" }
        ];

        // ==============================================
        // CARD DEALING MECHANICS
        // ==============================================
        let currentCard = -1;
        const table = document.querySelector('.table');
        const maxCards = 5; // how many cards visible at once
        const fanSpread = 30; // degrees of fan spread

        function drawCard() {
            currentCard = (currentCard + 1) % cards.length;
            const card = document.createElement('div');
            card.className = 'card';
            
            // Add content with optional custom styling
            card.innerHTML = `
                <div class="content" style="${cards[currentCard].style || ''}">
                    ${cards[currentCard].text}
                </div>
            `;
            
            // Position in fan formation
            const totalCards = table.children.length;
            const fanAngle = ((totalCards % maxCards) - (maxCards/2)) * (fanSpread/maxCards);
            const xOffset = fanAngle * 10; // shift cards horizontally based on angle
            
            // Initial position (flipped up)
            card.style.transform = `
                translateX(-50%) 
                translateX(${xOffset}px) 
                rotateX(180deg) 
                rotateZ(${fanAngle}deg)
            `;
            
            table.appendChild(card);
            
            // Animate to final position
            setTimeout(() => {
                card.style.transform = `
                    translateX(-50%) 
                    translateX(${xOffset}px) 
                    rotateZ(${fanAngle}deg)
                `;
            }, 50);
            
            // Remove old cards
            if (table.children.length > maxCards) {
                table.removeChild(table.children[0]);
            }
        }

        // ==============================================
        // CONTROLS
        // ==============================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                drawCard();
            }
        });

        // Mobile support
        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            drawCard();
        });
    </script>
</body>
</html>
