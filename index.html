<!DOCTYPE html>
<html lang="en">
<!-- [previous head content stays the same until card and table styling] -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neil.cards</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* [previous styles stay the same until card and table] */
        body { 
            margin: 0;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8));
            pointer-events: none;
        }

        .table {
            position: absolute;
            bottom: -30%; /* pushes cards up from bottom */
            left: 50%;
            transform: translateX(-50%);
            perspective: 1000px;
            width: 100vw;
            height: 50vh; /* contains cards in lower half */
        }

        .card {
            width: min(60vw, 400px); /* narrower width */
            height: min(80vh, 600px); /* taller height for proper card ratio */
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            position: absolute;
            left: 50%;
            transform-style: preserve-3d;
            transition: all 0.5s ease-out;
            box-shadow: 0 0 20px rgba(0,255,255,0.1);
        }

        .card:hover {
            box-shadow: 0 0 30px rgba(0,255,255,0.2);
        }

        .prompt {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: opacity 0.3s ease-out;
        }

        /* [rest of styles remain the same] */

        @media (max-width: 768px) {
            .card {
                width: 70vw;
                height: 85vh;
                bottom: -40%; /* adjust for mobile */
            }
            .table {
                bottom: -40%;
            }
        }
    </style>
</head>
<!-- [rest of the HTML and script remain the same] -->
<body>
    <div class="game-container">
        <div class="vignette"></div>
        <div class="prompt">press [space] to draw</div>
        <div class="name">neil</div>
        <div class="table"></div>
        <div class="crt-lines"></div>
        <div class="crt-flicker"></div>
