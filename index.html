<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neil.cards</title>
    
    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body { 
            margin: 0;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9));
            pointer-events: none;
        }

        .crt-lines {
            position: fixed;
            inset: 0;
            background: linear-gradient(transparent 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.3;
        }

        .table {
            position: absolute;
            bottom: -30%;
            left: 50%;
            transform: translateX(-50%);
            perspective: 1500px;
            width: 100vw;
            height: 100vh;
        }

        .card {
            width: min(90vw, 600px);
            height: min(70vh, 800px);
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            position: absolute;
            left: 50%;
            bottom: 0;
            transform-style: preserve-3d;
            transform-origin: bottom center;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .prompt {
            position: fixed;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Special Elite', cursive;
            font-size: min(24px, 5vw);
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 100;
            opacity: 0.7;
        }

        .content {
            font-size: min(24px, 5vw);
            text-align: center;
            line-height: 1.6;
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .card {
                width: 85vw;
                height: 60vh;
            }
            .table {
                bottom: -20%;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="vignette"></div>
        <div class="prompt">press [space] to draw</div>
        <div class="table"></div>
        <div class="crt-lines"></div>
    </div>

    <script>
        const cards = [
            "neil warren-bancquart",
            "do it now. it's just you and your future self",
            "send cold emails. make them 2 sentences.",
            "looking for: research assistant to hire",
            "what can i do with claude.ai?",
            "bouncing off the world is data-rich",
            "work on projects > extracurricular activities",
            "looking for people who do odd things oddly well",
        ];

        let currentCard = -1;
        const table = document.querySelector('.table');
        const maxCards = 5;
        const fanSpread = 30;

        function drawCard() {
            currentCard = (currentCard + 1) % cards.length;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="content">${cards[currentCard]}</div>`;
            
            const totalCards = table.children.length;
            const fanAngle = ((totalCards % maxCards) - (maxCards/2)) * (fanSpread/maxCards);
            const xOffset = fanAngle * 10;
            
            // Start from below and behind
            card.style.transform = `
                translateX(-50%) 
                translateX(${xOffset}px) 
                translateY(100vh)
                rotateZ(${fanAngle}deg)
            `;
            
            table.appendChild(card);
            
            // Animate up into position
            requestAnimationFrame(() => {
                card.style.transform = `
                    translateX(-50%) 
                    translateX(${xOffset}px) 
                    rotateZ(${fanAngle}deg)
                `;
            });
            
            if (table.children.length > maxCards) {
                const oldCard = table.children[0];
                oldCard.style.transform += ' translateY(-100vh)';
                oldCard.style.opacity = '0';
                setTimeout(() => oldCard.remove(), 500);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                drawCard();
            }
        });

        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            drawCard();
        });
    </script>
</body>
</html>
