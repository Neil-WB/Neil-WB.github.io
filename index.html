<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neil.cards</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8));
            pointer-events: none;
        }
        .table {
            position: absolute;
            bottom: -20%;
            left: 50%;
            transform: translateX(-50%);
            perspective: 1000px;
            width: 100vw;
            height: 100vh;
        }
        .card {
            width: min(80vw, 800px); /* bigger! */
            height: min(70vh, 1000px);
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            position: absolute;
            left: 50%;
            transform-style: preserve-3d;
            transition: all 0.5s ease-out;
            box-shadow: 0 0 20px rgba(0,255,255,0.1);
        }
        .card:hover {
            box-shadow: 0 0 30px rgba(0,255,255,0.2);
        }
        .prompt {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: opacity 0.3s ease-out;
        }
        .prompt.fade-out {
            opacity: 0;
            transform: translateX(-50%) scale(0.9);
        }
        .name {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%) scale(1.1);
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transition: all 0.5s ease-out;
        }
        .name.fade-in {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .content {
            font-size: min(24px, 5vw);
            text-align: center;
            line-height: 1.6;
            padding: 2rem;
        }
        .crt-lines {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                transparent 50%, 
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }
        .crt-flicker {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.02);
            opacity: 0;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }
        @keyframes flicker {
            0% { opacity: 0.1; }
            50% { opacity: 0; }
            100% { opacity: 0.1; }
        }

        @media (max-width: 768px) {
            .card {
                width: 85vw;
                height: 70vh;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="vignette"></div>
        <div class="prompt">press [space] to draw</div>
        <div class="name">neil</div>
        <div class="table"></div>
        <div class="crt-lines"></div>
        <div class="crt-flicker"></div>
    </div>

    <script>
        const cards = [
            "neil warren-bancquart",
            "do it now. it's just you and your future self",
            "send cold emails. make them 2 sentences.",
            "looking for: research assistant to hire",
            "what can i do with claude.ai?",
            "bouncing off the world is data-rich",
            "work on projects > extracurricular activities",
            "looking for people who do odd things oddly well",
        ];

        let currentCard = -1;
        let hasDrawnFirstCard = false;
        const table = document.querySelector('.table');
        const prompt = document.querySelector('.prompt');
        const name = document.querySelector('.name');
        const maxCards = 5;
        const fanSpread = 30;

        function drawCard() {
            if (!hasDrawnFirstCard) {
                prompt.classList.add('fade-out');
                setTimeout(() => {
                    name.classList.add('fade-in');
                }, 300);
                hasDrawnFirstCard = true;
            }

            currentCard = (currentCard + 1) % cards.length;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="content">${cards[currentCard]}</div>`;
            
            // Start from below
            const totalCards = table.children.length;
            const fanAngle = ((totalCards % maxCards) - (maxCards/2)) * (fanSpread/maxCards);
            const xOffset = fanAngle * 10;
            
            card.style.transform = `
                translateX(-50%) 
                translateX(${xOffset}px) 
                translateY(100vh)
                rotateZ(${fanAngle}deg)
            `;
            
            table.appendChild(card);
            
            // Animate to position
            requestAnimationFrame(() => {
                card.style.transform = `
                    translateX(-50%) 
                    translateX(${xOffset}px) 
                    rotateZ(${fanAngle}deg)
                `;
            });
            
            if (table.children.length > maxCards) {
                const oldCard = table.children[0];
                oldCard.style.transform += ' translateY(-100vh)';
                oldCard.style.opacity = '0';
                setTimeout(() => oldCard.remove(), 500);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                drawCard();
            }
        });

        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            drawCard();
        });
    </script>
</body>
</html>
