    // Updated retrievePapers (as shown above)
    async function retrievePapers(queryData) {
      try {
        const currentYear = new Date().getFullYear();
        const bioRxivPapers = [];
        for (let cursor = 0; cursor < 300; cursor += 100) {
          const searchUrl = `https://api.biorxiv.org/details/biorxiv/2021-01-01/${currentYear}-12-31/${cursor}/json`;
          const searchResponse = await fetch(searchUrl);
          if (!searchResponse.ok) {
            throw new Error(`BioRxiv API error: ${searchResponse.status}`);
          }
          const searchData = await searchResponse.json();
          if (searchData.collection) {
            bioRxivPapers.push(...searchData.collection.map(paper => ({
              source: 'bioRxiv',
              identifier: paper.doi,
              title: paper.title,
              authors: paper.authors,
              date: paper.date,
              abstract: paper.abstract,
              url: `https://www.biorxiv.org/content/${paper.doi}v${paper.version}`
            })));
          }
        }

        const arXivSearchTerms = queryData.searchTerms.replace(/ /g, '+');
        const arXivUrl = `http://export.arxiv.org/api/query?search_query=all:${arXivSearchTerms}&sortBy=relevance&sortOrder=descending&max_results=100`;
        const arXivResponse = await fetch(arXivUrl);
        if (!arXivResponse.ok) {
          throw new Error(`ArXiv API error: ${arXivResponse.status}`);
        }
        const arXivXml = await arXivResponse.text();
        const parser = new DOMParser();
        const arXivDoc = parser.parseFromString(arXivXml, 'application/xml');
        const entries = arXivDoc.querySelectorAll('entry');
        const arXivPapers = Array.from(entries).map(entry => {
          const id = entry.querySelector('id').textContent;
          const title = entry.querySelector('title').textContent;
          const authors = Array.from(entry.querySelectorAll('author name')).map(name => name.textContent).join(', ');
          const published = entry.querySelector('published').textContent;
          const abstract = entry.querySelector('summary').textContent;
          const url = id;
          return {
            source: 'arXiv',
            identifier: id.split('/').pop(),
            title,
            authors,
            date: published,
            abstract,
            url
          };
        });

        const allPapers = [...bioRxivPapers, ...arXivPapers];

        if (allPapers.length === 0) {
          return { success: false, error: "No papers found. Try different search terms." };
        }

        const paperInfosForSelection = allPapers.map(p => ({
          identifier: p.identifier,
          title: p.title,
          authors: p.authors,
          date: p.date
        }));
        const selectionCompletion = await callClaudeAPI(
          PAPER_SELECTION_PROMPT,
          JSON.stringify({ query: queryData.optimizedQuery, papers: paperInfosForSelection }),
          512
        );
        let selectedIdentifiers;
        try {
          const jsonMatch = selectionCompletion.match(/\[.*\]/s);
          if (jsonMatch) {
            selectedIdentifiers = JSON.parse(jsonMatch[0]);
          } else {
            throw new Error("Could not parse identifier list from Claude's response");
          }
        } catch (error) {
          console.error("Error parsing identifiers:", error);
          selectedIdentifiers = allPapers.slice(0, 5).map(p => p.identifier);
        }

        const selectedPapers = allPapers.filter(p => selectedIdentifiers.includes(p.identifier));

        if (selectedPapers.length === 0) {
          return { success: false, error: "Failed to select relevant papers" };
        }

        if (selectedPapers.length === 1) {
          return {
            success: true,
            query: queryData,
            allPapers,
            selectedPapers,
            bestPaper: selectedPapers[0]
          };
        }

        const bestPaperCompletion = await callClaudeAPI(
          BEST_PAPER_SELECTION_PROMPT,
          JSON.stringify({ query: queryData.optimizedQuery, papers: selectedPapers.map(p => ({ identifier: p.identifier, abstract: p.abstract })) }),
          512
        );
        let bestPaperIdentifier = bestPaperCompletion.trim();
        const bestPaper = selectedPapers.find(p => p.identifier === bestPaperIdentifier) || selectedPapers[0];

        return {
          success: true,
          query: queryData,
          allPapers,
          selectedPapers,
          bestPaper
        };
      } catch (error) {
        console.error("Paper retrieval error:", error);
        return { success: false, error: `Failed to retrieve papers: ${error.message}` };
      }
    }
